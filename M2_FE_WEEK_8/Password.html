<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <h1>Change Password</h1>

    <form id="passwordForm">
      <input id="userId" placeholder="ID" required />
      <input
        id="oldPassword"
        type="password"
        placeholder="Old Password"
        required
      />
      <input
        id="newPassword"
        type="password"
        placeholder="New Password"
        required
      />
      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm new Password"
        required
      />

      <button type="submit">Change Password</button>
    </form>

    <p>
      <a href="login.html">Login</a>
    </p>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <script>
      const form = document.getElementById("passwordForm");

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const id = document.getElementById("userId").value;
        const oldPassword = document.getElementById("oldPassword").value;
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        let users = [];
        if (localStorage.getItem("users") !== null) {
          users = JSON.parse(localStorage.getItem("users"));
        }

        const userIndex = users.findIndex(function (user) {
          return user.id === id;
        });

        if (userIndex === -1) {
          alert("User does not exist");
          return;
        }

        const user = users[userIndex];

        if (user.data.password !== oldPassword) {
          alert("Old Password incorrect");
          return;
        }

        if (newPassword !== confirmPassword) {
          alert("The new password does not match the confirmation");
          return;
        }

        user.data.password = newPassword;

        try {
          await axios.put(`https://api.restful-api.dev/objects/${id}`, {
            name: user.name,
            data: user.data,
          });
        } catch (error) {
          console.log("Error", error);
        }

        users[userIndex] = user;
        localStorage.setItem("users", JSON.stringify(users));

        const sessionUser = JSON.parse(localStorage.getItem("sessionUser"));

        if (sessionUser && sessionUser.id === id) {
          localStorage.setItem("sessionUser", JSON.stringify(user));
        }

        alert("Password successfully updated");
        window.location.href = "Login.html";
      });
    </script>
  </body>
</html>
